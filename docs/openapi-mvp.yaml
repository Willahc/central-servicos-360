openapi: 3.0.3
info:
  title: Central de Serviços 360 - API REST
  description: |
    API REST da Central de Serviços 360 — MVP Local (Fase 1B).

    Esta especificação reflete a implementação real do backend.
    Autenticação: Mock local (MOCK_AUTH=true). Não usar em produção.
    Dados: Repositórios in-memory com seed data fictício.
    Validação: Zod (retorna 422 para erros de schema).

    Decisão sobre prefixo /v1/: Por enquanto, a API usa /api/ sem versão.
    Motivo: MVP local sem consumidores externos. Reavaliar antes de Fase 2.
  version: 1.0.0-alpha.2
  contact:
    name: Diretoria de Infraestrutura & Supply Chain
    email: infraestrutura@hsl.example.com
  license:
    name: UNLICENSED
    private: true

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Healthcheck do servidor
      description: Retorna status do servidor e módulos disponíveis.
      security: []
      tags: [Sistema]
      responses:
        '200':
          description: Servidor operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      summary: Login simulado
      description: Autenticação mock. Aceita email ou role. Retorna token simulado.
      security: []
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
              description: Forneça email OU role para autenticar.
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '404':
          description: Usuário não encontrado
        '422':
          description: Email ou role obrigatório

  /api/auth/session:
    get:
      summary: Obter sessão ativa
      tags: [Autenticação]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessão retornada
        '401':
          description: Token não fornecido ou inválido

  /api/auth/logout:
    post:
      summary: Encerrar sessão
      tags: [Autenticação]
      responses:
        '200':
          description: Sessão encerrada

  /api/auth/roles:
    get:
      summary: Listar perfis disponíveis
      description: Retorna os 9 perfis de demonstração.
      security: []
      tags: [Autenticação]
      responses:
        '200':
          description: Lista de perfis

  /api/requests:
    get:
      summary: Listar solicitações com filtros
      tags: [Solicitações]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - name: serviceType
          in: query
          schema:
            $ref: '#/components/schemas/ServiceType'
        - name: requesterId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de solicitações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      summary: Criar nova solicitação
      description: >
        Criação sempre com status RASCUNHO. Status diferente é rejeitado (422).
        Roles permitidas: qualquer perfil autenticado (colaborador, gestor, viagens, etc.).
      tags: [Solicitações]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Solicitação criada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/requests/{id}:
    get:
      summary: Detalhar solicitação
      tags: [Solicitações]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da solicitação (inclui allowedTransitions)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/requests/{id}/submit:
    put:
      summary: Enviar solicitação para aprovação
      description: Transição RASCUNHO → PENDENTE_APROVACAO
      tags: [Solicitações]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Solicitação enviada
        '400':
          description: Transição inválida
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/requests/{id}/transition:
    put:
      summary: Transição genérica de status
      description: |
        Transições permitidas:
        RASCUNHO → PENDENTE_APROVACAO, CANCELADO
        PENDENTE_APROVACAO → APROVADO, REJEITADO, CANCELADO
        APROVADO → EM_ATENDIMENTO
        EM_ATENDIMENTO → CONCLUIDO

        Autorização por transição (roles permitidas):
        PENDENTE_APROVACAO → APROVADO/REJEITADO: gestor, coordenadora, administrador
        PENDENTE_APROVACAO → CANCELADO: colaborador, gestor, coordenadora, administrador
        APROVADO → EM_ATENDIMENTO: viagens, administrador
        EM_ATENDIMENTO → CONCLUIDO: viagens, administrador
        RASCUNHO → PENDENTE_APROVACAO: qualquer autenticado
        RASCUNHO → CANCELADO: qualquer autenticado
      tags: [Solicitações]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetStatus]
              properties:
                targetStatus:
                  $ref: '#/components/schemas/RequestStatus'
                user:
                  type: string
      responses:
        '200':
          description: Transição realizada
        '400':
          description: Transição inválida
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/requests/{id}/history:
    get:
      summary: Obter histórico de alterações
      tags: [Solicitações]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Histórico da solicitação

  /api/requests/{id}:
    delete:
      summary: Cancelar solicitação (soft delete)
      description: >
        Transição para CANCELADO. Mantém histórico e registro para auditabilidade.
        Roles permitidas: colaborador (próprio), gestor, coordenadora, administrador.
      tags: [Solicitações]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Solicitação cancelada
        '400':
          description: Transição inválida (ex: CONCLUIDO não pode ser cancelado)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/dashboard/metrics:
    get:
      summary: KPIs consolidados do dashboard
      tags: [Dashboard]
      responses:
        '200':
          description: Métricas retornadas

  /api/dashboard/status-distribution:
    get:
      summary: Distribuição de solicitações por status
      tags: [Dashboard]
      responses:
        '200':
          description: Distribuição retornada

  /api/dashboard/recent-queue:
    get:
      summary: Fila operacional recente (últimas 5)
      tags: [Dashboard]
      responses:
        '200':
          description: Fila retornada

  /api/approvals/pending:
    get:
      summary: Listar pendências de aprovação
      tags: [Aprovações]
      responses:
        '200':
          description: Lista de pendências

  /api/approvals/{id}/approve:
    put:
      summary: Aprovar solicitação
      description: Transição PENDENTE_APROVACAO → APROVADO. Requer role: gestor, coordenadora ou administrador.
      tags: [Aprovações]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverName]
              properties:
                approverName:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: Solicitação aprovada
        '400':
          description: Transição inválida
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/approvals/{id}/reject:
    put:
      summary: Rejeitar solicitação
      description: |
        Transição PENDENTE_APROVACAO → REJEITADO.
        Justificativa obrigatória (RN-GER-005).
        Requer role: gestor, coordenadora ou administrador.
      tags: [Aprovações]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverName, reason]
              properties:
                approverName:
                  type: string
                reason:
                  type: string
                  minLength: 1
                  description: Justificativa obrigatória (RN-GER-005)
      responses:
        '200':
          description: Solicitação rejeitada
        '400':
          description: Transição inválida
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/approvals/history:
    get:
      summary: Histórico de aprovações
      tags: [Aprovações]
      responses:
        '200':
          description: Histórico retornada

  /api/viagens:
    get:
      summary: Listar solicitações de viagem
      tags: [Viagens]
      responses:
        '200':
          description: Lista de viagens

  /api/viagens/{id}:
    get:
      summary: Detalhes da viagem
      tags: [Viagens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da viagem
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/viagens/{id}/itinerary:
    get:
      summary: Dados do itinerário
      tags: [Viagens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Itinerário retornado

  /api/viagens/{id}/start:
    put:
      summary: Iniciar atendimento da viagem
      description: Transição APROVADO → EM_ATENDIMENTO. Requer role: viagens ou administrador.
      tags: [Viagens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Viagem em atendimento
        '400':
          description: Transição inválida

  /api/viagens/{id}/complete:
    put:
      summary: Concluir viagem
      description: Transição EM_ATENDIMENTO → CONCLUIDO. Requer role: viagens ou administrador.
      tags: [Viagens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Viagem concluída
        '400':
          description: Transição inválida

  /api/non-flown-tickets:
    get:
      summary: Listar bilhetes não voados
      tags: [Viagens]
      responses:
        '200':
          description: Lista de bilhetes

  /api/non-flown-tickets/{id}/apply:
    put:
      summary: Aplicar crédito de bilhete não voado
      tags: [Viagens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Crédito aplicado

  /api/mobilidade/rides:
    get:
      summary: Listar corridas realizadas
      tags: [Mobilidade]
      responses:
        '200':
          description: Lista de corridas

  /api/mobilidade/rides/{id}:
    get:
      summary: Detalhes de uma corrida
      tags: [Mobilidade]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da corrida
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/mobilidade/access-requests:
    post:
      summary: Solicitar acesso/ajuste de mobilidade
      tags: [Mobilidade]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobilidadeAccessInput'
      responses:
        '201':
          description: Solicitação criada

  /api/mobilidade/limits:
    get:
      summary: Consultar limites mensais
      tags: [Mobilidade]
      responses:
        '200':
          description: Limites retornados

  /api/mobilidade/voucher:
    post:
      summary: Solicitar voucher Uber
      tags: [Mobilidade]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userEmail:
                  type: string
                  format: email
                costCenter:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Voucher gerado

  /api/correios:
    get:
      summary: Listar pedidos de envio
      tags: [Correios]
      responses:
        '200':
          description: Lista de envios

    post:
      summary: Criar nova solicitação de postagem
      tags: [Correios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreioInput'
      responses:
        '201':
          description: Solicitação criada

  /api/correios/{id}:
    get:
      summary: Detalhes do envio
      tags: [Correios]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do envio
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/correios/{id}/tracking:
    get:
      summary: Consultar rastreamento
      tags: [Correios]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados de rastreamento

  /api/correios/{id}/usage-type:
    put:
      summary: Definir modalidade (institucional/pessoal)
      tags: [Correios]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usageType]
              properties:
                usageType:
                  type: string
                  enum: [institucional, pessoal]
      responses:
        '200':
          description: Modalidade atualizada
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/xerox/jobs:
    get:
      summary: Listar jobs de impressão
      tags: [Xerox]
      responses:
        '200':
          description: Lista de jobs

    post:
      summary: Criar novo job de impressão
      tags: [Xerox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XeroxJobInput'
      responses:
        '201':
          description: Job criado

  /api/xerox/jobs/{id}:
    get:
      summary: Detalhes do job
      tags: [Xerox]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do job
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/xerox/jobs/{id}/file:
    post:
      summary: Upload do arquivo (simulado)
      tags: [Xerox]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload simulado

  /api/xerox/jobs/{id}/status:
    get:
      summary: Status de produção
      tags: [Xerox]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status do job

  /api/xerox/jobs/{id}/complete:
    put:
      summary: Marcar job como concluído
      description: Transição para CONCLUIDO. Requer role: faturamento, coordenadora ou administrador.
      tags: [Xerox]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job concluído

  /api/finance/cost-centers:
    get:
      summary: Listar centros de custo com estatísticas
      tags: [Financeiro]
      responses:
        '200':
          description: Lista de centros de custo

  /api/finance/cost-centers/{code}/summary:
    get:
      summary: Resumo consolidado do centro de custo
      tags: [Financeiro]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resumo retornado
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/finance/cost-centers/{code}/requests:
    get:
      summary: Solicitações do centro de custo
      tags: [Financeiro]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de solicitações

  /api/finance/conciliation:
    get:
      summary: Status de conciliação SAP
      tags: [Financeiro]
      responses:
        '200':
          description: Status da conciliação

  /api/finance/export:
    post:
      summary: Exportar dados para SAP/Senior
      description: Requer role: financeiro ou administrador.
      tags: [Financeiro]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                costCenter:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        '200':
          description: Exportação simulada

  /api/suppliers:
    get:
      summary: Listar fornecedores
      tags: [Fornecedores]
      responses:
        '200':
          description: Lista de fornecedores

  /api/suppliers/{id}:
    get:
      summary: Detalhes do fornecedor
      tags: [Fornecedores]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do fornecedor
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/suppliers/{id}/sla:
    get:
      summary: Métricas de SLA do fornecedor
      tags: [Fornecedores]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Métricas SLA

  /api/tickets:
    get:
      summary: Listar chamados
      tags: [Atendimentos]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de chamados

    post:
      summary: Abrir novo chamado
      tags: [Atendimentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: Chamado aberto
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/tickets/{id}:
    get:
      summary: Detalhes do chamado
      tags: [Atendimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do chamado
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/tickets/{id}/resolve:
    put:
      summary: Marcar chamado como resolvido
      description: Requer role: faturamento, coordenadora ou administrador.
      tags: [Atendimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, assignedTo]
              properties:
                resolution:
                  type: string
                assignedTo:
                  type: string
      responses:
        '200':
          description: Chamado resolvido
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/tickets/{id}/escalate:
    put:
      summary: Escalonar chamado
      description: Apenas chamados EM_ABERTO podem ser escalonados.
      tags: [Atendimentos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Chamado escalonado
        '400':
          description: Chamado não está em aberto

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Mock JWT
      description: |
        Token mock: mock_jwt_token_${userId}_${role}_${timestamp}
        ABORDAGEM A (adotada): MOCK_AUTH=true — apenas para demonstração local.
        Não valida assinatura, payload nem expiração.
        Não implementar SSO corporativo nesta etapa.

  responses:
    UnauthorizedError:
      description: Token não fornecido ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Perfil de usuário não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Dados inválidos (Zod)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    RequestStatus:
      type: string
      enum: [RASCUNHO, PENDENTE_APROVACAO, APROVADO, EM_ATENDIMENTO, CONCLUIDO, REJEITADO, CANCELADO]

    ServiceType:
      type: string
      enum: [viagem, mobilidade, correios, xerox]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
        appName:
          type: string
        version:
          type: string
        mode:
          type: string
          enum: [MOCK_ACTIVE, PRODUCTION]
        mockAuth:
          type: boolean
        timestamp:
          type: string
          format: date-time
        modules:
          type: array
          items:
            type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              type: object
            token:
              type: string
            expiresIn:
              type: integer

