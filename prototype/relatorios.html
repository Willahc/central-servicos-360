<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var savedTheme = localStorage.getItem("cs360_theme");
        var theme = savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        root.classList.add("cs360-booting");
        root.dataset.theme = theme;
        root.dataset.sidebarCollapsed = localStorage.getItem("cs360_sidebar_collapsed") === "true" ? "true" : "false";
      } catch (_) {}
    })();
  </script>
  <title>Central de Serviços 360 - Relatórios &amp; Indicadores</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/secondary-pages.css">
</head>
<body data-page="relatorios-secondary">
  <div id="app-layout-root">
    <main class="page-content reports-page" id="page-content-slot">
      <div id="reports-view" aria-live="polite"></div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/secondary-pages.js"></script>
</body>
</html>
